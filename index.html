<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/anchor.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anchor</title>
    <meta name="description" content="Anchor is a fast, local-first personal browser homepage with bookmarks, boards, to-dos, theming, and wallpapers. No accounts, no server." />
    <meta name="theme-color" content="#09090b" />
    <style>
      html, body {
        background-color: #09090b;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
    </style>
    <script>
      /* Pre-hydration baseline & accent loader to eliminate flash of unstyled theme */
      try {
        const raw = localStorage.getItem('anchor-data');
        if (raw) {
          const s = JSON.parse(raw);
          if (s?.theme?.custom) {
            const { top, middle, bottom } = s.theme.custom;
            if (top) document.documentElement.style.setProperty('--color-top', top);
            if (middle) document.documentElement.style.setProperty('--color-middle', middle);
            if (bottom) document.documentElement.style.setProperty('--color-bottom', bottom);
          }
          if (s?.labelColors) {
            if (s.labelColors.activePage) {
              document.documentElement.style.setProperty('--accent', s.labelColors.activePage);
            }
            if (s.labelColors.linkButton) {
              document.documentElement.style.setProperty('--accent-btn', s.labelColors.linkButton);
            }
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
